<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#171815" />
    <meta name="description" content="An animated companion for GipPity Remote." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./pet-icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
    <title>Pi Pet</title>
  </head>
  <body>
    <main class="shell">
      <header class="masthead">
        <a class="wordmark" href="./" aria-label="Pi Pet home">
          <span class="wordmark-mark">π</span>
          <span>pet</span>
        </a>
        <div class="connection" aria-live="polite">
          <span id="connection-dot" class="connection-dot"></span>
          <span id="connection-label">Connecting</span>
        </div>
      </header>

      <section class="companion-layout" aria-label="Pi Pet companion">
        <div id="stage" class="stage">
          <div id="bubble" class="bubble" hidden></div>
          <canvas id="pet-canvas" width="384" height="416" aria-label="Animated Pi Pet"></canvas>
          <button id="wave-button" class="pet-hit-area" type="button" aria-label="Wave to the pet"></button>
          <form id="desktop-prompt-form" class="desktop-prompt" hidden>
            <div class="desktop-prompt-heading">
              <label id="desktop-prompt-label" for="desktop-prompt-text">Talk to your pet</label>
              <button id="desktop-prompt-close" type="button" aria-label="Close prompt">×</button>
            </div>
            <textarea id="desktop-prompt-text" maxlength="8000" rows="2" placeholder="What should we do?"></textarea>
            <div class="desktop-prompt-footer">
              <span id="desktop-prompt-feedback" aria-live="polite"></span>
              <div class="prompt-buttons">
                <button id="desktop-voice-button" class="voice-button" type="button">Voice</button>
                <button id="desktop-dictation-button" class="voice-button" type="button">Dictate</button>
                <button id="desktop-prompt-submit" type="submit">Send</button>
              </div>
            </div>
          </form>
          <p id="pointer-hint" class="pointer-hint">Move nearby. Your pet is watching.</p>
        </div>

        <aside class="console">
          <div class="identity">
            <h1 id="pet-name">Pi Pet</h1>
            <p id="pet-description" class="description">Connecting through GipPity Remote.</p>
          </div>

          <section aria-labelledby="now-title">
            <div class="section-heading">
              <h2 id="now-title">Now</h2>
              <span id="voice-state" class="quiet">Voice idle</span>
            </div>
            <div class="current-state">
              <span id="action-name" class="action-name">idle</span>
              <span id="action-note" class="action-note">Following the active Pi session</span>
            </div>
          </section>

          <section aria-labelledby="preview-title">
            <div class="section-heading">
              <h2 id="preview-title">Preview</h2>
              <button id="restore-action" class="text-button" type="button">Follow Pi</button>
            </div>
            <div id="quick-actions" class="quick-actions"></div>
            <label class="select-label" for="action-select">Every action</label>
            <select id="action-select"><option>Loading actions</option></select>
          </section>

          <section class="prompt-section" aria-labelledby="prompt-title">
            <div class="section-heading">
              <h2 id="prompt-title">Talk to Pi</h2>
              <span id="agent-state" class="quiet">Connecting</span>
            </div>
            <form id="prompt-form">
              <label class="sr-only" for="prompt-text">Prompt for the connected Pi session</label>
              <textarea id="prompt-text" maxlength="8000" rows="3" placeholder="Send a thought back through your pet…"></textarea>
              <div class="prompt-footer">
                <span id="prompt-feedback" class="prompt-feedback" aria-live="polite"></span>
                <div class="prompt-buttons">
                  <button id="voice-button" class="voice-button" type="button">Voice</button>
                  <button id="prompt-submit" class="send-button" type="submit">Send</button>
                </div>
              </div>
            </form>
          </section>
        </aside>
      </section>
    </main>

    <script src="/_gippity/client.js"></script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
