# Keep the transparent pet borderless, fully opaque where painted, and above workspaces.
windowrule = tag -default-opacity, match:class ^electron$, match:title ^(Pi Pet|Clawa · Pi Pet)$
windowrule = opacity 1 1, match:class ^electron$, match:title ^(Pi Pet|Clawa · Pi Pet)$
windowrule = float on, match:class ^electron$, match:title ^(Pi Pet|Clawa · Pi Pet)$
windowrule = pin on, match:class ^electron$, match:title ^(Pi Pet|Clawa · Pi Pet)$
windowrule = border_size 0, match:class ^electron$, match:title ^(Pi Pet|Clawa · Pi Pet)$
windowrule = no_shadow on, match:class ^electron$, match:title ^(Pi Pet|Clawa · Pi Pet)$
windowrule = no_blur on, match:class ^electron$, match:title ^(Pi Pet|Clawa · Pi Pet)$
windowrule = no_initial_focus on, match:class ^electron$, match:title ^(Pi Pet|Clawa · Pi Pet)$
windowrule = move (monitor_w-window_w-40) (monitor_h-window_h-40), match:class ^electron$, match:title ^(Pi Pet|Clawa · Pi Pet)$
