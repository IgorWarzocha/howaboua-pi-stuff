[package]
name = "pi-codex-voice"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
anyhow = "=1.0.104"
async-trait = "=0.1.92"
base64 = "=0.23.1"
bytes = "=1.12.2"
cpal = "=0.18.2"
crossbeam-queue = "=0.3.14"
opus = "=0.4.0"
rand = "=0.10.4"
rtc = { version = "=0.21.1", default-features = false }
rubato = { version = "=5.1.0", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sonora = { version = "=0.2.0", default-features = false }
tokio = { version = "=1.54.1", features = ["io-std", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
webrtc = "=0.21.1"

[profile.release]
strip = true
lto = true
codegen-units = 1
