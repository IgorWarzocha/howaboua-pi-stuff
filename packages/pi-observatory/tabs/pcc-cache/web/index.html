<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>PCC cache</title>
	<link rel="stylesheet" href="/base.css">
	<link rel="stylesheet" href="/theme.css">
	<link rel="stylesheet" href="style.css">
	<script type="module" src="view.js"></script>
</head>
<body>
<main>
	<p id="waiting" role="status">Waiting for cache logs…</p>
	<div id="dashboard" hidden>
		<div class="toolbar">
			<label>Request type<select id="lane"><option value="response">Responses</option><option value="compaction">Compaction</option><option value="">All types</option></select></label>
			<label>Model<select id="model"><option value="">All models</option></select></label>
			<label id="scope-filter" hidden>Scope<select id="scope"><option value="">All scopes</option></select></label>
		</div>
		<p id="coverage" class="muted" role="status"></p>
		<div id="query-status" role="status" hidden><span id="query-message"></span> <button id="retry" type="button" hidden>Retry</button></div>
		<div id="results" hidden>
		<div id="metrics" class="metrics"></div>
		<section class="panel" aria-labelledby="misses-title">
			<div class="section-heading"><h2 id="misses-title">Mid-flight cache misses</h2><strong id="misses-total" class="chart-total"></strong></div>
			<p id="rebill-coverage" class="muted" hidden></p>
			<div id="misses-chart" class="chart"></div>
		</section>
		<section class="panel" aria-labelledby="cost-title">
			<div class="section-heading"><h2 id="cost-title">Estimated rebill cost</h2><strong id="cost-total" class="chart-total"></strong></div>
			<p id="cost-coverage" class="muted" hidden></p>
			<div id="cost-chart" class="chart"></div>
		</section>
		<section class="panel" aria-labelledby="requests-title">
			<div class="section-heading"><h2 id="requests-title">Requests</h2><label>Cache result<select id="result"><option value="">All results</option><option value="hit">Hit</option><option value="miss">Miss</option><option value="unknown">Unmeasured</option></select></label></div>
			<div class="table-scroll" tabindex="0" role="region" aria-label="Request details, scroll horizontally for all columns">
				<table><thead><tr><th>Time / session</th><th>Model / type</th><th>Cache</th><th>Cached / input</th><th>Transport / history</th><th>Outcome</th><th>Elapsed</th></tr></thead><tbody id="rows"></tbody></table>
			</div>
			<div class="pagination"><span id="page-status" class="muted" role="status"></span><button id="previous" type="button">Previous</button><button id="next" type="button">Next</button></div>
		</section>
		</div>
	</div>
</main>
</body>
</html>
