<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark light"><title>Pi Observatory</title><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script></head>
<body>
<header><h1>Pi Observatory</h1><p id="status" role="status">Connecting…</p></header>
<main>
<p id="error" role="alert" hidden></p>
<section class="session-picker" aria-label="Session selection">
<div class="session-controls">
<label>Search sessions<input id="session-search" type="search" placeholder="Project or session ID" aria-describedby="sessions-status"></label>
<label class="session-choice">Session<select id="session" name="session" form="filters" aria-describedby="sessions-status"><option value="">All sessions</option></select></label>
<button id="all-sessions" type="button">All sessions</button><button id="current-session" type="button" hidden>Current session</button>
</div>
<p id="sessions-status" class="muted" role="status">Loading recent sessions…</p>
</section>
<form id="filters" aria-label="Filter calls">
<label>Provider<select name="provider"><option value="">All providers</option></select></label>
<label>Model<select name="model"><option value="">All models</option></select></label>
<label>Tool<select name="tool"><option value="">All tools</option></select></label>
<label>Project<select name="project"><option value="">All projects</option></select></label>
<label>From (UTC)<input name="since" type="date"></label><label>Until (UTC)<input name="until" type="date"></label>
<label>Scope<select name="scope"><option value="all">Direct + nested</option><option value="direct">Direct</option><option value="nested">Nested</option></select></label>
<label class="search">Search<input name="q" type="search" placeholder="Tool or message"></label>
<input name="signature" type="hidden">
<button type="submit">Apply filters</button><button type="reset" id="reset-filters">Reset filters</button>
</form>
<p id="pattern" hidden><span id="pattern-text"></span> <button id="clear-pattern" type="button">Clear pattern</button></p>
<section aria-label="Usage"><div id="totals" role="status">Loading…</div>
<div class="breakdowns"><div id="tools" class="table-scroll" tabindex="0" role="region" aria-label="Tools"></div><div id="models" class="table-scroll" tabindex="0" role="region" aria-label="Models"></div></div>
<details><summary id="errors-summary">Errors</summary><div id="groups" class="table-scroll" tabindex="0" role="region" aria-label="Errors"></div></details>
<details id="command-exits"><summary id="exits-summary">Nonzero exits</summary><div id="exits" class="table-scroll" tabindex="0" role="region" aria-label="Nonzero exits"></div></details>
<details><summary>Daily</summary><div id="daily" class="table-scroll" tabindex="0" role="region" aria-label="Daily calls"></div></details>
<details id="coverage"><summary>Coverage</summary><div id="outcome-coverage"></div><p id="coverage-text"></p><ul id="index-issues"></ul></details>
</section>
<section aria-labelledby="calls-heading"><div class="section-heading"><h2 id="calls-heading" tabindex="-1">Calls</h2><label>Outcome<select id="outcome"><option value="all">All</option><option value="error">Errors</option><option value="nonzero">Nonzero exits</option><option value="ok">OK</option><optgroup label="Coverage"><option value="incomplete">No final result</option><option value="unknown">Unclassified result</option></optgroup></select></label><button id="refresh" type="button">Refresh</button><span id="new-data" role="status"></span></div>
<p id="calls-status" role="status"></p><div id="calls" class="table-scroll"></div><nav aria-label="Call pages"><button id="newest" type="button">Newest page</button><button id="older" type="button" disabled>Older calls</button></nav>
</section>
<section id="detail" aria-labelledby="detail-heading" hidden><div class="section-heading"><h2 id="detail-heading" tabindex="-1">Call</h2><button id="close-detail" type="button">Close</button></div><p id="detail-status" role="status"></p><div id="detail-content"></div></section>
</main>
</body></html>
