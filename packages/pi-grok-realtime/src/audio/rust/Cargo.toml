[package]
name = "pi-grok-audio"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[[bin]]
name = "grok-audio"
path = "src/main.rs"

[dependencies]
cpal = "=0.18.2"
sonora = { version = "=0.2.0", default-features = false }
serde_json = "=1.0.149"

[profile.release]
strip = true
lto = true
codegen-units = 1
