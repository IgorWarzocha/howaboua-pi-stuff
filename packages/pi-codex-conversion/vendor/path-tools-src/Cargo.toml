[workspace]
members = [
  "crates/codex-utils-cache",
  "crates/codex-utils-image",
  "crates/codex-utils-pty",
  "crates/codex-exec-shim",
  "crates/codex-view-image",
  "crates/codex-web-run",
  "crates/codex-imagegen",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
version = "0.0.0"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22.1"
chrono = "0.4"
codex-utils-cache = { path = "crates/codex-utils-cache" }
codex-utils-image = { path = "crates/codex-utils-image" }
codex-utils-pty = { path = "crates/codex-utils-pty" }
crypto_box = { version = "0.9", features = ["seal"] }
ed25519-dalek = { version = "2", features = ["pkcs8"] }
image = { version = "^0.25.9", default-features = false }
lru = "0.16.3"
mime_guess = "2.0.5"
os_info = "3.12.0"
portable-pty = "0.9"
libc = "0.2"
pretty_assertions = "1"
lazy_static = "1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
reqwest = { version = "0.12", features = ["cookies", "json", "rustls-tls-native-roots", "stream"] }
uuid = { version = "1", features = ["v4"] }
sha1 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "rt", "rt-multi-thread", "sync"] }
