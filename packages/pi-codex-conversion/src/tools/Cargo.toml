[workspace]
members = [
  "apply-patch/rust",
  "exec/rust",
  "view-image/rust",
  "rust/crates/codex-utils-cache",
  "rust/crates/codex-utils-image",
  "rust/crates/codex-utils-pty",
  "rust/crates/codex-utils-absolute-path",
  "rust/crates/codex-utils-path-uri",
  "rust/crates/pi-apply-patch-fs",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
version = "0.0.0"

[workspace.dependencies]
anyhow = "=1.0.104"
assert_matches = "=1.5.0"
async-trait = "=0.1.92"
base64 = "=0.23.1"
codex-utils-absolute-path = { path = "rust/crates/codex-utils-absolute-path" }
codex-utils-path-uri = { path = "rust/crates/codex-utils-path-uri" }
codex-utils-cache = { path = "rust/crates/codex-utils-cache" }
codex-utils-image = { path = "rust/crates/codex-utils-image" }
codex-utils-pty = { path = "rust/crates/codex-utils-pty" }
dirs = "=7.0.0"
dunce = "=1.0.5"
image = { version = "=0.25.10", default-features = false }
lazy_static = "=1.5.1"
libc = "=0.2.191"
log = "=0.4.35"
lru = "=0.19.1"
mime_guess = "=2.0.5"
portable-pty = "=0.9.0"
pretty_assertions = "=1.4.1"
schemars = "=1.2.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha1 = "=0.11.0"
similar = "=3.2.1"
tempfile = "=3.27.0"
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = ["fs", "macros", "rt", "rt-multi-thread", "sync"] }
tree-sitter = "=0.27.2"
tree-sitter-bash = "=0.25.1"
ts-rs = { version = "=12.0.1", features = ["serde-json-impl", "no-serde-warnings"] }
url = "=2.5.9"
urlencoding = "=2.1.3"

[profile.release]
strip = true
lto = true
codegen-units = 1
