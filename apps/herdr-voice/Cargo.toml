[package]
name = "herdr-voice"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
anyhow = "=1.0.104"
axum = "=0.8.9"
clap = { version = "=4.6.9", features = ["derive"] }
dirs = "=7.0.0"
futures-util = "=0.3.34"
http-body-util = "=0.1.5"
hyper = { version = "=1.12.0", features = ["client", "http1"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
if-addrs = "=0.15.0"
native-tls = "=0.2.18"
reqwest = { version = "=0.13.5", default-features = false, features = ["native-tls-no-alpn", "json", "stream"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-native-tls = "=0.3.1"
tokio-tungstenite = { version = "=0.30.0", features = ["native-tls"] }
url = "=2.5.9"
uuid = { version = "=1.29.3", features = ["v4"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
