name: Pi Stuff issue
description: Describe the problem in plain English, then add any technical details.
title: "[package]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: "Start with 2 or 3 plain-English sentences: what you want to do, what gets in the way, and what should happen instead. Explain unfamiliar terms. Put implementation proposals in the technical details below."
      placeholder: |
        I want to ...
        Currently ...
        I'd like ...
    validations:
      required: true

  - type: dropdown
    id: package
    attributes:
      label: Which package is this about?
      description: Pick the closest one. If this is about a skill, include its name in your description.
      options:
        - Not sure / general
        - pi-ask
        - pi-auto-trees
        - pi-better-skills-tool
        - pi-browser
        - pi-cache-hit-predictor
        - pi-codex-conversion
        - pi-codex-guardian
        - pi-codex-imagegen
        - pi-codex-web-run
        - pi-dynamic-tools
        - pi-explore-subagents
        - pi-gippity-control
        - pi-gpt-switcher
        - pi-memories
        - pi-pet
        - pi-semantic-grep
        - pi-shepherdr
        - pi-smart-btw
        - pi-subagent-review
        - pi-subdir-agents
        - pi-unicode-charts
        - pi-vent
        - A skill
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: What kind of thing is it?
      options:
        - Bug / broken behavior
        - Confusing UX or docs
        - Feature request
        - Packaging / install / update problem
        - Other
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce, if this is a bug
      description: Give the shortest steps or prompt that reproduces the problem. Leave blank if you cannot reproduce it.
      placeholder: |
        1. Install ...
        2. Run ...
        3. See ...

  - type: input
    id: pi-version
    attributes:
      label: Versions
      description: For bugs, include Pi and affected package versions if known.
      placeholder: "Pi 1.x, pi-shepherdr 0.x"

  - type: textarea
    id: extra
    attributes:
      label: Technical details
      description: Optional logs, config, screenshots, or implementation ideas. The main request above should make sense without this section. Remove API keys, passwords, and other secrets.
