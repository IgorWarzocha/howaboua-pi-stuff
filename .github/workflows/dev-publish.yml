name: Publish dev package

on:
  push:
    tags:
      - 'dev/pi-codex-conversion/*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Set ephemeral dev version
        working-directory: packages/pi-codex-conversion
        shell: bash
        run: |
          base=$(node -p "require('./package.json').version")
          IFS=. read -r major minor patch <<<"$base"
          version="$major.$minor.$((patch + 1))-dev.${GITHUB_RUN_NUMBER}.${GITHUB_SHA:0:7}"
          npm pkg set "version=$version"
          echo "version=$version" >> "$GITHUB_ENV"
      - name: Publish dev tag
        working-directory: packages/pi-codex-conversion
        run: npm publish --tag dev --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Report version
        run: echo "Published @howaboua/pi-codex-conversion@$version"
