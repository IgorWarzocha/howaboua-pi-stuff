name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  changed-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Check changed workspace packages only
        env:
          CHANGED_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}
        run: bun run check:changed
      - name: Verify Codex extension release assets
        env:
          CHANGED_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}
        run: |
          for package in pi-codex-conversion pi-codex-conversion-lite; do
            if git diff --quiet "$CHANGED_BASE...HEAD" -- "packages/$package"; then
              continue
            fi
            bun run --cwd "packages/$package" build
            bun run --cwd "packages/$package" verify:codex-tool-binaries
            bun run --cwd "packages/$package" verify:code-mode-host-assets
            npm pack --dry-run --ignore-scripts "./packages/$package"
          done
      - name: Verify GipPity release assets
        env:
          CHANGED_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}
        run: |
          if git diff --quiet "$CHANGED_BASE...HEAD" -- packages/pi-gippity-control; then
            exit 0
          fi
          manifest=$(npm pack --dry-run --json ./packages/pi-gippity-control)
          for asset in \
            src/voice/bin/darwin-arm64/pi-codex-voice \
            src/voice/bin/darwin-x64/pi-codex-voice \
            src/voice/bin/linux-arm64/pi-codex-voice \
            src/voice/bin/linux-x64/pi-codex-voice \
            src/voice/bin/win32-arm64/pi-codex-voice.exe \
            src/voice/bin/win32-x64/pi-codex-voice.exe; do
            jq -e --arg asset "$asset" '.[0].files | any(.path == $asset)' <<<"$manifest" >/dev/null
          done
