name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  changed-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Resolve changed base
        id: changed-base
        env:
          EVENT_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          base="$EVENT_BASE"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base=$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
      - name: Check changed workspace packages only
        env:
          CHANGED_BASE: ${{ steps.changed-base.outputs.base }}
        run: bun run check:changed
      - name: Verify Codex extension release assets
        env:
          CHANGED_BASE: ${{ steps.changed-base.outputs.base }}
        run: |
          if git diff --quiet "$CHANGED_BASE...HEAD" -- packages/pi-codex-conversion; then
            exit 0
          fi
          bun run --cwd packages/pi-codex-conversion build
          bun run --cwd packages/pi-codex-conversion verify:codex-tool-binaries
          bun run --cwd packages/pi-codex-conversion verify:code-mode-host-assets
          npm pack --dry-run --ignore-scripts ./packages/pi-codex-conversion
      - name: Verify GipPity release assets
        env:
          CHANGED_BASE: ${{ steps.changed-base.outputs.base }}
        run: |
          if git diff --quiet "$CHANGED_BASE...HEAD" -- packages/pi-gippity-control; then
            exit 0
          fi
          manifest=$(npm pack --dry-run --json --ignore-scripts ./packages/pi-gippity-control)
          for asset in \
            src/voice/bin/darwin-arm64/pi-codex-voice \
            src/voice/bin/darwin-x64/pi-codex-voice \
            src/voice/bin/linux-arm64/pi-codex-voice \
            src/voice/bin/linux-x64/pi-codex-voice \
            src/voice/bin/win32-arm64/pi-codex-voice.exe \
            src/voice/bin/win32-x64/pi-codex-voice.exe; do
            jq -e --arg asset "$asset" '.[0].files | any(.path == $asset)' <<<"$manifest" >/dev/null
          done
