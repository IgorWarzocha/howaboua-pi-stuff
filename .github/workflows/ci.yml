name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  changed-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Check changed workspace packages only
        env:
          CHANGED_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}
        run: bun run check:changed
      - name: Verify pi-codex-conversion-lite release assets
        env:
          CHANGED_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}
        run: |
          if git diff --quiet "$CHANGED_BASE...HEAD" -- packages/pi-codex-conversion-lite; then
            exit 0
          fi
          bun run --cwd packages/pi-codex-conversion-lite build
          bun run --cwd packages/pi-codex-conversion-lite verify:codex-tool-binaries
          bun run --cwd packages/pi-codex-conversion-lite verify:code-mode-host-assets
          npm pack --dry-run --ignore-scripts ./packages/pi-codex-conversion-lite
