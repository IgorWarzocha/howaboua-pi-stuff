name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - '.changeset/**'
      - 'scripts/**'
      - 'package.json'
      - 'bun.lock'
      - 'bunfig.toml'
      - '.node-version'
      - '.npmrc'
      - '.github/workflows/release.yml'

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    environment: npm-release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2
      # npm provides its bundled node-gyp before Bun starts native install hooks.
      - run: npm run install:ci
      - name: Build pi-codex-conversion extension
        run: bun run --cwd packages/pi-codex-conversion build
      - name: Verify packed Pi extensions load in isolation
        run: node scripts/verify-pi-extension-artifact.mjs --no-build packages/pi-codex-conversion
      - name: Add aggregate package changesets
        run: bun run changeset:aggregates
      - name: Changesets release
        id: changesets
        uses: changesets/action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          publish-script: bun run release
          version-script: bun run version-packages
          create-github-releases: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Delete Changesets release branch after publish
        if: steps.changesets.outputs.published == 'true'
        run: git push origin --delete changeset-release/main || true
