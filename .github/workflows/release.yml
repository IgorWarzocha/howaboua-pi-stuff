name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm-release
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Build pi-codex-conversion extension
        run: bun run --cwd packages/pi-codex-conversion build
      - name: Verify packed Pi extensions load in isolation
        run: node scripts/verify-pi-extension-artifact.mjs --no-build packages/pi-codex-conversion
      - name: Add aggregate package changesets
        run: bun run changeset:aggregates
      - name: Changesets release
        id: changesets
        uses: changesets/action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          publish-script: bun run release
          version-script: bun run version-packages
          create-github-releases: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Delete Changesets release branch after publish
        if: steps.changesets.outputs.published == 'true'
        run: git push origin --delete changeset-release/main || true
